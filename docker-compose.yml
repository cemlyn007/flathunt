services:
  dagster:
    build: .
    image: flathunt:local
    command: sh -c "python /app/scripts/fail_orphaned_runs.py && exec dagster dev --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /app/.dagster
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts:ro
      - ./cache:/app/cache
      - ./.dagster:/app/.dagster
      - ./greater-london-251126-free:/app/greater-london-251126-free:ro
      - ./resources.yaml:/app/resources.yaml:ro
    restart: unless-stopped

  streamlit:
    image: flathunt:local
    depends_on:
      - dagster
    command: >
      streamlit run src/flathunt/scripts/flathunter.py
        --server.address 0.0.0.0
        --server.port 8501
    ports:
      - "8502:8501"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./cache:/app/cache:ro
      - ./greater-london-251126-free:/app/greater-london-251126-free:ro
    restart: unless-stopped
