default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: uvx ty check
        language: system
        pass_filenames: false
      - id: pytest-check
        name: pytest-check
        entry: uv run pytest -m "not regression"
        language: system
        types: [python]
        files: ^tests/
        pass_filenames: false
      - id: vulture-dead-code
        name: vulture-dead-code
        entry: bash -c 'uv run vulture src 2>&1 | grep -E "unused (function|class)" && exit 1 || exit 0'
        language: system
        types: [python]
        pass_filenames: false
